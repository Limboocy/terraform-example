# Reusable step template: init + plan, then publish the plan as an artifact so
# the Apply stage consumes the EXACT reviewed plan (no re-plan drift).
parameters:
  - name: workingDir
    type: string
  - name: serviceConnection
    type: string
  - name: environment
    type: string

steps:
  - task: AzureCLI@2
    displayName: "terraform init + plan"
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        export ARM_USE_OIDC=true
        cd "${{ parameters.workingDir }}"
        terraform init
        terraform plan -input=false -out=tfplan
        # Human-readable copy for the PR reviewer.
        terraform show -no-color tfplan > plan.txt

  - task: PublishPipelineArtifact@1
    displayName: "Publish tfplan artifact"
    inputs:
      targetPath: "${{ parameters.workingDir }}/tfplan"
      artifact: "tfplan-${{ parameters.environment }}"

  - task: PublishPipelineArtifact@1
    displayName: "Publish human-readable plan"
    inputs:
      targetPath: "${{ parameters.workingDir }}/plan.txt"
      artifact: "plan-txt-${{ parameters.environment }}"
